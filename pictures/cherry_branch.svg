<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <g fill="black" stroke="black" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- BRANCH -->
    <path d="M 10,380 C 120,360 190,300 240,250 C 270,220 330,190 490,140 C 495,138 490,150 480,155 C 330,205 270,235 240,265 C 180,325 110,380 10,400 Z" stroke="none" />
    <path d="M 210,280 C 180,240 150,220 120,210 C 118,210 135,225 150,245" stroke-width="3" fill="none" />
    <path d="M 330,200 C 350,160 380,140 410,120 C 405,125 380,150 350,180" stroke-width="3" fill="none" />

    <!-- MAIN CENTRAL BLOSSOM -->
    <g transform="translate(240,250)">
      <!-- Petal 1: Top -->
      <path d="M 0,-10 C -18,-35 -30,-60 -12,-85 C -4,-97 0,-85 0,-85 C 0,-85 4,-97 12,-85 C 30,-60 18,-35 0,-10 Z" stroke-width="1.5" />
      <!-- Petal 2: Top Right -->
      <g transform="rotate(72)">
        <path d="M 0,-10 C -18,-35 -30,-60 -12,-85 C -4,-97 0,-85 0,-85 C 0,-85 4,-97 12,-85 C 30,-60 18,-35 0,-10 Z" stroke-width="1.5" />
      </g>
      <!-- Petal 3: Bottom Right -->
      <g transform="rotate(144)">
        <path d="M 0,-10 C -18,-35 -30,-60 -12,-85 C -4,-97 0,-85 0,-85 C 0,-85 4,-97 12,-85 C 30,-60 18,-35 0,-10 Z" stroke-width="1.5" />
      </g>
      <!-- Petal 4: Bottom Left -->
      <g transform="rotate(216)">
        <path d="M 0,-10 C -18,-35 -30,-60 -12,-85 C -4,-97 0,-85 0,-85 C 0,-85 4,-97 12,-85 C 30,-60 18,-35 0,-10 Z" stroke-width="1.5" />
      </g>
      <!-- Petal 5: Top Left -->
      <g transform="rotate(288)">
        <path d="M 0,-10 C -18,-35 -30,-60 -12,-85 C -4,-97 0,-85 0,-85 C 0,-85 4,-97 12,-85 C 30,-60 18,-35 0,-10 Z" stroke-width="1.5" />
      </g>

      <!-- Center & Stamens -->
      <circle cx="0" cy="0" r="8" />
      <g stroke-width="1.2">
        <!-- Radiating filaments with anther tips -->
        <path d="M 0,0 L 0,-30" /><circle cx="0" cy="-32" r="2" />
        <path d="M 0,0 L 18,-24" /><circle cx="20" cy="-26" r="2" />
        <path d="M 0,0 L 28,-10" /><circle cx="30" cy="-11" r="2" />
        <path d="M 0,0 L 28,10" /><circle cx="30" cy="11" r="2" />
        <path d="M 0,0 L 18,24" /><circle cx="20" cy="26" r="2" />
        <path d="M 0,0 L 0,30" /><circle cx="0" cy="32" r="2" />
        <path d="M 0,0 L -18,24" /><circle cx="-20" cy="26" r="2" />
        <path d="M 0,0 L -28,10" /><circle cx="-30" cy="11" r="2" />
        <path d="M 0,0 L -28,-10" /><circle cx="-30" cy="-11" r="2" />
        <path d="M 0,0 L -18,-24" /><circle cx="-20" cy="-26" r="2" />
      </g>
    </g>

    <!-- SMALLER UPPER RIGHT BLOSSOM -->
    <g transform="translate(390,135) scale(0.65)">
      <path d="M 0,-10 C -18,-35 -30,-60 -12,-85 C -4,-97 0,-85 0,-85 C 0,-85 4,-97 12,-85 C 30,-60 18,-35 0,-10 Z" stroke-width="2" />
      <g transform="rotate(72)"><path d="M 0,-10 C -18,-35 -30,-60 -12,-85 C -4,-97 0,-85 0,-85 C 0,-85 4,-97 12,-85 C 30,-60 18,-35 0,-10 Z" stroke-width="2" /></g>
      <g transform="rotate(144)"><path d="M 0,-10 C -18,-35 -30,-60 -12,-85 C -4,-97 0,-85 0,-85 C 0,-85 4,-97 12,-85 C 30,-60 18,-35 0,-10 Z" stroke-width="2" /></g>
      <g transform="rotate(216)"><path d="M 0,-10 C -18,-35 -30,-60 -12,-85 C -4,-97 0,-85 0,-85 C 0,-85 4,-97 12,-85 C 30,-60 18,-35 0,-10 Z" stroke-width="2" /></g>
      <g transform="rotate(288)"><path d="M 0,-10 C -18,-35 -30,-60 -12,-85 C -4,-97 0,-85 0,-85 C 0,-85 4,-97 12,-85 C 30,-60 18,-35 0,-10 Z" stroke-width="2" /></g>
      <circle cx="0" cy="0" r="8" />
      <g stroke-width="1.5">
        <path d="M 0,0 L 0,-25" /><circle cx="0" cy="-27" r="2.5" />
        <path d="M 0,0 L 22,-12" /><circle cx="24" cy="-13" r="2.5" />
        <path d="M 0,0 L 22,12" /><circle cx="24" cy="13" r="2.5" />
        <path d="M 0,0 L 0,25" /><circle cx="0" cy="27" r="2.5" />
        <path d="M 0,0 L -22,12" /><circle cx="-24" cy="13" r="2.5" />
        <path d="M 0,0 L -22,-12" /><circle cx="-24" cy="-13" r="2.5" />
      </g>
    </g>

    <!-- BUDS AND DRIFTING PETALS -->
    <!-- Side Branch Bud -->
    <g transform="translate(120,210) rotate(-30)">
      <path d="M 0,0 C -10,-15 -5,-30 0,-40 C 5,-30 10,-15 0,0 Z" stroke-width="1.5" />
      <path d="M -8,-5 C -15,-10 -12,-25 -3,-30" stroke-width="1.5" fill="none" />
    </g>
    
    <!-- Drifting Petals -->
    <g transform="translate(140,340) rotate(45) scale(0.5)">
      <path d="M 0,-10 C -18,-35 -30,-60 -12,-85 C -4,-97 0,-85 0,-85 C 0,-85 4,-97 12,-85 C 30,-60 18,-35 0,-10 Z" stroke-width="2" />
    </g>
    <g transform="translate(320,330) rotate(110) scale(0.4)">
      <path d="M 0,-10 C -18,-35 -30,-60 -12,-85 C -4,-97 0,-85 0,-85 C 0,-85 4,-97 12,-85 C 30,-60 18,-35 0,-10 Z" stroke-width="2" />
    </g>
    <g transform="translate(420,260) rotate(15) scale(0.45)">
      <path d="M 0,-10 C -18,-35 -30,-60 -12,-85 C -4,-97 0,-85 0,-85 C 0,-85 4,-97 12,-85 C 30,-60 18,-35 0,-10 Z" stroke-width="2" />
    </g>

  </g>
</svg>
